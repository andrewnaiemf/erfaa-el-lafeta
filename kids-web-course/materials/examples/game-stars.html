<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>صيّاد النجوم ⭐</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
      background: linear-gradient(180deg, #0f3d6b 0%, #1e6bb8 50%, #87ceeb 100%);
      color: #fff;
      overflow: hidden;
      user-select: none;
    }
    .hud {
      position: fixed;
      top: 0; left: 0; right: 0;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(15, 61, 107, 0.85);
      z-index: 10;
      font-weight: 800;
      font-size: 1.1rem;
    }
    #arena {
      position: fixed;
      inset: 0;
      top: 52px;
    }
    .star {
      position: absolute;
      width: 72px;
      height: 72px;
      display: grid;
      place-items: center;
      font-size: 2.8rem;
      cursor: pointer;
      filter: drop-shadow(0 0 8px #f0c84a);
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .star.caught {
      pointer-events: none;
      opacity: 0;
      transform: scale(1.4);
      transition: opacity 0.12s, transform 0.12s;
    }
    .ground {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 48px;
      background: linear-gradient(180deg, #1f9d6a, #157a52);
      border-top: 4px solid #f0c84a;
    }
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 61, 107, 0.92);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
      text-align: center;
      padding: 24px;
    }
    .overlay h1 { font-size: 1.8rem; margin: 0 0 12px; }
    .overlay p { font-size: 1.1rem; margin: 0 0 24px; opacity: 0.9; }
    .overlay.hidden { display: none; }
    .btn {
      font-family: inherit;
      font-size: 1.2rem;
      font-weight: 900;
      padding: 16px 36px;
      border: none;
      border-radius: 16px;
      background: linear-gradient(180deg, #f0c84a, #e8a317);
      color: #0f3d6b;
      cursor: pointer;
      margin: 6px;
    }
    input {
      font-family: inherit;
      font-size: 1.1rem;
      padding: 12px 16px;
      border-radius: 12px;
      border: 3px solid #f0c84a;
      text-align: center;
      margin-bottom: 16px;
      width: 220px;
      max-width: 90vw;
    }
  </style>
</head>
<body>
  <div class="hud">
    <span id="playerName">⭐ اللاعب</span>
    <span id="score">النقاط: 0</span>
    <span id="misses">وقعت: 0 / 3</span>
  </div>
  <div id="arena"></div>
  <div class="ground"></div>

  <div class="overlay" id="startScreen">
    <h1>⭐ صيّاد النجوم</h1>
    <p>اضغط النجمة قبل ما توصل الأرض!<br>3 نجوم وقعت = انتهت اللعبة<br>كل 20 نجمة اللعبة تبقى أسرع شوية ⚡</p>
    <input type="text" id="nameInput" placeholder="اسمك" maxlength="20" />
    <button class="btn" type="button" id="startBtn">ابدأ 🚀</button>
  </div>

  <div class="overlay hidden" id="endScreen">
    <h1 id="endTitle">🎉 برافو!</h1>
    <p id="endMsg"></p>
    <button class="btn" type="button" id="againBtn">من جديد 🔄</button>
  </div>

  <script>
    const arena = document.getElementById("arena");
    const scoreEl = document.getElementById("score");
    const missesEl = document.getElementById("misses");
    const playerName = document.getElementById("playerName");
    const startScreen = document.getElementById("startScreen");
    const endScreen = document.getElementById("endScreen");

    let score = 0, misses = 0, running = false, spawnTimer = null, stars = [];

    function rand(min, max) { return Math.random() * (max - min) + min; }

    function level() {
      return Math.floor(score / 20);
    }

    function speedBoost() {
      // كل 20 نجمة: أسرع شوية — سقف معقول للأطفال
      return Math.min(level() * 0.7, 4.2);
    }

    function spawnDelay() {
      return Math.max(900 - level() * 80, 480);
    }

    function restartSpawnTimer() {
      clearInterval(spawnTimer);
      spawnTimer = setInterval(spawnStar, spawnDelay());
    }

    function spawnStar() {
      if (!running) return;
      const el = document.createElement("div");
      el.className = "star";
      el.textContent = "⭐";
      el.setAttribute("role", "button");
      el.setAttribute("aria-label", "نجمة");
      const x = rand(5, 85);
      el.style.left = x + "%";
      el.style.top = "-70px";
      const boost = speedBoost();
      const speed = rand(2.5, 4.5) + boost;
      let y = -70;
      let caught = false;
      arena.appendChild(el);

      const tick = setInterval(function () {
        if (!running || caught) { clearInterval(tick); return; }
        y += speed;
        el.style.top = y + "px";
        const ground = arena.clientHeight - 40;
        if (y > ground) {
          clearInterval(tick);
          el.remove();
          misses++;
          missesEl.textContent = "وقعت: " + misses + " / 3";
          if (misses >= 3) endGame(false);
        }
      }, 16);

      function catchStar(e) {
        if (!running || caught) return;
        e.preventDefault();
        e.stopPropagation();
        caught = true;
        clearInterval(tick);
        el.classList.add("caught");
        const prevLevel = level();
        score++;
        scoreEl.textContent = "النقاط: " + score;
        if (level() > prevLevel) {
          scoreEl.textContent = "النقاط: " + score + " · أسرع! ⚡";
          restartSpawnTimer();
        }
        setTimeout(function () { el.remove(); }, 120);
      }

      el.addEventListener("pointerdown", catchStar);

      stars.push({ el, tick });
    }

    function startGame() {
      const name = document.getElementById("nameInput").value.trim() || "بطل";
      playerName.textContent = "⭐ " + name;
      score = 0; misses = 0; running = true;
      scoreEl.textContent = "النقاط: 0";
      missesEl.textContent = "وقعت: 0 / 3";
      arena.innerHTML = "";
      stars = [];
      startScreen.classList.add("hidden");
      endScreen.classList.add("hidden");
      restartSpawnTimer();
    }

    function endGame(win) {
      running = false;
      clearInterval(spawnTimer);
      stars.forEach(function (s) { clearInterval(s.tick); s.el.remove(); });
      document.getElementById("endTitle").textContent = win ? "🎉 برافو!" : "⭐ انتهت اللعبة";
      document.getElementById("endMsg").textContent = "جمعت " + score + " نجمة!";
      endScreen.classList.remove("hidden");
    }

    document.getElementById("startBtn").addEventListener("click", startGame);
    document.getElementById("againBtn").addEventListener("click", function () {
      endScreen.classList.add("hidden");
      startScreen.classList.remove("hidden");
    });
  </script>
</body>
</html>
