<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>ورقة لعبة حياتي — الحصة 6</title>
  <style>
    @page { size: A4; margin: 10mm; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Tahoma, Arial, sans-serif; background: #eef5fb; color: #1a2a3a; }
    .no-print { text-align: center; padding: 12px; }
    .no-print button {
      font: inherit; font-weight: 900; padding: 10px 20px; border: none;
      border-radius: 10px; background: #f0c84a; color: #0f3d6b; cursor: pointer;
    }
    .sheet {
      width: 190mm; margin: 8px auto; background: #fff; padding: 8mm;
      border: 4px solid #1e6bb8; border-radius: 16px;
    }
    h1 { margin: 0 0 2mm; color: #1e6bb8; font-size: 16pt; text-align: center; }
    .sub { text-align: center; font-weight: 800; color: #64748b; font-size: 9pt; margin-bottom: 4mm; }
    .name { font-weight: 800; font-size: 11pt; margin-bottom: 4mm; }
    .name u { display: inline-block; min-width: 50mm; border-bottom: 1.5px solid #1e6bb8; }
    .q {
      border: 2px dashed #93c5fd; border-radius: 10px; padding: 3mm; margin-bottom: 3mm;
    }
    .q .t { font-weight: 900; color: #1e4f86; font-size: 10pt; margin-bottom: 2mm; }
    .line { border-bottom: 1.5px dotted #cbd5e1; min-height: 7mm; margin-bottom: 1.5mm; }
    .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 2mm; font-size: 9pt; font-weight: 700; }
    .opts span { border: 1.5px solid #e2e8f0; border-radius: 6px; padding: 1.5mm 2mm; min-height: 8mm; }
    .tip { font-size: 8pt; font-weight: 800; color: #64748b; text-align: center; margin-top: 2mm; }
    @media print {
      .no-print { display: none !important; }
      body { background: #fff; }
      .sheet { margin: 0; width: auto; box-shadow: none; }
    }
  </style>
</head>
<body>

    <div class="q">

</body>
</html>
